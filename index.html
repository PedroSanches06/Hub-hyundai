<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hyundai Portal • Home</title>
  <meta name="description" content="Modern dark-blue portal with animated navigation and organized sections." />
  <style>
    /* -----------------------------
       DESIGN TOKENS
    ------------------------------ */
    :root{
      --bg0:#061225;
      --bg1:#071a33;
      --bg2:#0a2346;
      --card: rgba(255,255,255,.06);
      --card2: rgba(255,255,255,.08);
      --stroke: rgba(255,255,255,.12);
      --text:#eaf2ff;
      --muted: rgba(234,242,255,.72);
      --accent:#49b2ff;
      --accent2:#2de2ff;
      --good:#45f3a6;
      --warn:#ffd36a;

      --shadow: 0 16px 50px rgba(0,0,0,.45);
      --radius: 18px;
      --radius2: 26px;
      --max: 1120px;

      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }

    /* -----------------------------
       BASE
    ------------------------------ */
    *{ box-sizing: border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(900px 600px at 10% 10%, rgba(73,178,255,.18), transparent 55%),
        radial-gradient(700px 520px at 90% 12%, rgba(45,226,255,.10), transparent 55%),
        radial-gradient(900px 700px at 50% 100%, rgba(73,178,255,.10), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 35%, var(--bg2));
      overflow-x:hidden;
    }

    a{ color:inherit; text-decoration:none; }
    button{ font-family:inherit; }

    .wrap{
      width:min(var(--max), calc(100% - 40px));
      margin:0 auto;
    }

    /* -----------------------------
       TOP BAR
    ------------------------------ */
    header{
      position:sticky;
      top:0;
      z-index:50;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: rgba(6,18,37,.55);
      border-bottom: 1px solid rgba(255,255,255,.10);
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 14px 0;
      gap: 14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap: 12px;
      min-width: 240px;
    }

    .logoBox{
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(73,178,255,.22), rgba(45,226,255,.10));
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
      display:grid;
      place-items:center;
      overflow:hidden;
    }
    /* Replace this placeholder with your official Hyundai logo */
    .logoBox img{
      width: 80%;
      height: 80%;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.45));
    }
    .brandText{
      display:flex;
      flex-direction:column;
      line-height:1.1;
    }
    .brandText strong{
      font-size: 14px;
      letter-spacing:.7px;
      text-transform: uppercase;
    }
    .brandText span{
      font-size: 13px;
      color: var(--muted);
    }

    .actions{
      display:flex;
      align-items:center;
      gap: 10px;
    }

    .pill{
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--text);
      display:flex;
      align-items:center;
      gap: 10px;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
      cursor:pointer;
      user-select:none;
    }
    .pill:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.09);
      border-color: rgba(73,178,255,.35);
    }

    .kbd{
      font-size:12px;
      padding: 4px 8px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.18);
      color: var(--muted);
    }

    /* Hamburger */
    .hamburger{
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      display:grid;
      place-items:center;
      cursor:pointer;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }
    .hamburger:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.09);
      border-color: rgba(73,178,255,.35);
    }
    .hamLines{
      width: 18px;
      height: 12px;
      position:relative;
    }
    .hamLines span{
      position:absolute;
      left:0;
      width:100%;
      height:2px;
      background: rgba(234,242,255,.92);
      border-radius: 999px;
      transition: transform .25s ease, top .25s ease, opacity .25s ease;
    }
    .hamLines span:nth-child(1){ top:0; }
    .hamLines span:nth-child(2){ top:5px; opacity:.95; }
    .hamLines span:nth-child(3){ top:10px; }

    .hamburger.active .hamLines span:nth-child(1){ top:5px; transform: rotate(45deg); }
    .hamburger.active .hamLines span:nth-child(2){ opacity:0; }
    .hamburger.active .hamLines span:nth-child(3){ top:5px; transform: rotate(-45deg); }

    /* -----------------------------
       HERO
    ------------------------------ */
    .hero{
      padding: 34px 0 12px;
    }
    .heroGrid{
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 18px;
      align-items:stretch;
    }

    .heroCard{
      border-radius: var(--radius2);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.04));
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
    }

    .heroCard::before{
      content:"";
      position:absolute;
      inset:-2px;
      background: radial-gradient(600px 300px at 20% 20%, rgba(73,178,255,.25), transparent 60%),
                  radial-gradient(500px 300px at 90% 10%, rgba(45,226,255,.18), transparent 60%);
      filter: blur(14px);
      opacity:.7;
      pointer-events:none;
    }

    .heroContent{
      position:relative;
      padding: 22px 22px 20px;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(73,178,255,.12);
      border: 1px solid rgba(73,178,255,.22);
      color: rgba(234,242,255,.92);
      font-size: 13px;
      letter-spacing: .2px;
    }
    .badgeDot{
      width: 9px;
      height: 9px;
      border-radius: 99px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 0 0 6px rgba(73,178,255,.14);
    }
    h1{
      margin: 14px 0 8px;
      font-size: clamp(26px, 3.2vw, 40px);
      line-height:1.05;
      letter-spacing: -.5px;
    }
    .sub{
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      max-width: 62ch;
      margin: 0 0 16px;
    }

    .ctaRow{
      display:flex;
      flex-wrap:wrap;
      gap: 10px;
      margin-top: 6px;
    }
    .btn{
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 14px;
      cursor:pointer;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
      display:inline-flex;
      align-items:center;
      gap: 10px;
    }
    .btn:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.10);
      border-color: rgba(73,178,255,.35);
    }
    .btn.primary{
      background: linear-gradient(135deg, rgba(73,178,255,.22), rgba(45,226,255,.14));
      border-color: rgba(73,178,255,.35);
    }

    .sideCard{
      border-radius: var(--radius2);
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      box-shadow: var(--shadow);
      padding: 18px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap: 14px;
      position:relative;
      overflow:hidden;
    }
    .sideCard::after{
      content:"";
      position:absolute;
      right:-40px;
      top:-40px;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle at 30% 30%, rgba(73,178,255,.25), transparent 60%);
      filter: blur(10px);
      opacity:.7;
    }
    .metric{
      position:relative;
      display:flex;
      flex-direction:column;
      gap: 6px;
    }
    .metric strong{
      font-size: 14px;
      color: rgba(234,242,255,.92);
    }
    .metric span{
      color: var(--muted);
      font-size: 13px;
      line-height:1.5;
    }
    .progress{
      position:relative;
      width:100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.10);
      overflow:hidden;
    }
    .progress > i{
      display:block;
      height:100%;
      width: 62%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 999px;
      box-shadow: 0 10px 24px rgba(73,178,255,.25);
      animation: load 1.6s ease both;
    }
    @keyframes load{
      from{ width: 18%; opacity:.7; }
      to{ width: 62%; opacity:1; }
    }

    /* -----------------------------
       SECTIONS GRID
    ------------------------------ */
    main{
      padding: 16px 0 70px;
    }

    .sectionHead{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 12px;
      margin: 18px 0 12px;
    }
    .sectionHead h2{
      margin:0;
      font-size: 18px;
      letter-spacing: .2px;
    }
    .sectionHead p{
      margin:0;
      color: var(--muted);
      font-size: 13px;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
    }

    .card{
      grid-column: span 6;
      border-radius: var(--radius);
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.12);
      padding: 16px;
      box-shadow: 0 14px 40px rgba(0,0,0,.25);
      position:relative;
      overflow:hidden;
      transform: translateY(0);
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
      cursor:pointer;
      min-height: 140px;
    }
    .card:hover{
      transform: translateY(-2px);
      background: rgba(255,255,255,.07);
      border-color: rgba(73,178,255,.30);
    }

    .card::before{
      content:"";
      position:absolute;
      inset:-2px;
      background: radial-gradient(420px 240px at 20% 20%, rgba(73,178,255,.16), transparent 60%),
                  radial-gradient(420px 240px at 90% 30%, rgba(45,226,255,.10), transparent 60%);
      opacity:.65;
      pointer-events:none;
    }

    .cardInner{
      position:relative;
      display:flex;
      gap: 14px;
      align-items:flex-start;
    }

    .icon{
      width: 44px;
      height: 44px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      display:grid;
      place-items:center;
      flex: 0 0 auto;
    }

    .icon svg{ opacity:.92; }

    .cardTitle{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      width:100%;
    }
    .cardTitle strong{
      font-size: 15px;
      letter-spacing: .2px;
    }
    .tag{
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      color: var(--muted);
      white-space:nowrap;
    }

    .card p{
      margin: 6px 0 0;
      color: var(--muted);
      line-height:1.55;
      font-size: 13px;
      max-width: 60ch;
    }

    /* -----------------------------
       ANIMATED SIDEBAR MENU
    ------------------------------ */
    .overlay{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity:0;
      pointer-events:none;
      transition: opacity .22s ease;
      z-index:60;
    }
    .overlay.show{
      opacity:1;
      pointer-events:auto;
    }

    nav.sidebar{
      position:fixed;
      top:0;
      right:0;
      height:100%;
      width: min(420px, 92vw);
      background: rgba(6,18,37,.82);
      border-left: 1px solid rgba(255,255,255,.12);
      box-shadow: -20px 0 60px rgba(0,0,0,.55);
      transform: translateX(110%);
      transition: transform .28s cubic-bezier(.2,.9,.2,1);
      z-index:70;
      display:flex;
      flex-direction:column;
      padding: 16px;
      gap: 14px;
    }
    nav.sidebar.open{
      transform: translateX(0);
    }

    .navTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 6px 4px 10px;
      border-bottom: 1px solid rgba(255,255,255,.10);
    }
    .navTop strong{
      font-size: 14px;
      letter-spacing:.6px;
