<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Secure File Store — Login</title>
  <meta name="description" content="Login seguro para gerenciar arquivos sensíveis." />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img src="./assets/logo.svg" alt="Secure File Store logo" class="site-logo" />
      <div class="brand-text">
        <div class="brand-title">Secure File Store</div>
        <div class="brand-sub">Gerencie seus arquivos com segurança</div>
      </div>
    </div>
  </header>

  <div id="root" class="root"></div>

  <script>
    // Ajuste automático do API_BASE:
    window.API_BASE = window.API_BASE || (
      (location.hostname === "localhost" || location.hostname === "127.0.0.1")
        ? "http://localhost:4000"
        : ""
    );
  </script>
  <script src="./app.js" defer></script>
</body>
</html>
